apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: resilientshop-ingress
  namespace: vault
spec:
  ingressClassName: nginx
  rules:
  - host: resilientshop.local
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: resilientshop-service
            port:
              number: 80