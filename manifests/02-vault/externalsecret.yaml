apiVersion: external-secrets.io/v1
kind: ExternalSecret # ExternalSecret is a resource that allows you to define how to fetch secrets from an external secret management system and create Kubernetes secrets from them. It specifies the source of the secrets, the target Kubernetes secret, and any transformation or mapping needed.
metadata:
  name: vault-secret 
  namespace: vault
spec: 
  refreshInterval: "1h" # = The refresh interval specifies how often the ExternalSecret controller should check for updates to the external secret and synchronize it with the Kubernetes secret. In this case, it is set to refresh every hour.
  secretStoreRef: # The secretStoreRef specifies the reference to the SecretStore resource that defines how to connect to the external secret management system (Vault in this case).
    name: vault-backend
    kind: SecretStore # The kind field indicates that the referenced resource is a SecretStore, which contains the connection details and authentication methods for accessing secrets from Vault.
  target: 
    name: db-vault-secret # The target specifies the name of the Kubernetes secret that will be created or updated with the fetched secrets from Vault. In this case, it will create or update a secret named "db-vault-secret" in the "vault" namespace.
    creationPolicy: Owner # The creationPolicy field specifies how the target secret should be managed. In this case, it is set to "Owner," which means that the ExternalSecret controller will create and manage the target secret, and it will be deleted when the ExternalSecret is deleted.
  data: # short explantion:
    - secretKey: db-username # The secretKey specifies the key in the target Kubernetes secret where the fetched secret value will be stored. In this case, it will store the database username.
      remoteRef: # The remoteRef specifies the reference to the external secret in Vault that contains the value to be fetched.
        key: db-credentials # The key field indicates the path in Vault where the secret is stored. In this case, it is "db-credentials."
        property: username # The property field specifies which property of the secret at the given key should be fetched. In this case, it will fetch the "username" property from the "db-credentials" secret in Vault.
    - secretKey: db-password # Similar to the previous entry, this specifies another key in the target Kubernetes secret for storing the database password.
      remoteRef:
        key: db-credentials
        property: password # This will fetch the "password" property from the "db-credentials" secret in Vault and store it in the "db-password" key of the target Kubernetes secret
      data: # data field is used to specify the mapping of keys in the target Kubernetes secret to the corresponding properties in the external secret. It allows you to define how the fetched secrets should be structured in the target secret.
      - secretkey: PASSWORD
        remoteRef: # The remoteRef specifies the reference to the external secret in Vault that contains the value to be fetched.
        key: resilientshop/db # The key field indicates the path in Vault where the secret is stored. In this case, it is "resilientshop/db."
        property: password # The property field specifies which property of the secret at the given key should be fetched. In this case, it will fetch the "password" property from the "resilientshop/db" secret in Vault.