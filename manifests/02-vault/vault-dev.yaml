apiVersion: apps/v1
kind: Deployment
metadata: 
  name: vault
  namespace: vault
  labels: 
    app.kubernetes.io/name:  vault
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: vault
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vault
    spec:
      containers:
      - name: vault
        image: hashicorp/vault:1.15.2
        command: ["vault", "server", "-dev", "-dev-root-token-id=root", "-dev-listen-address=0.0.0.0:8200"]              
        ports:
        - containerPort: 8200
          name: http
        securityContext:
          capabilities:
            add: ["IPC_LOCK"]
---
apiVersion: v1
kind: Service
metadata: 
  name: vault
  namespace: vault
spec:
  ports:
  - port: 8200
    targetPort: 8200
    name: http
  selector:
    app.kubernetes.io/name: vault
